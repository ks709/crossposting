name: Drip backlog reels

on:
  schedule:
    - cron: "0 9,15,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: list what would be posted, upload nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # TEMPORARY: download-only probe of the permalink fallback. Uploads
      # nothing, writes no state. Reverted immediately after this run.
      - name: Check the permalink fallback
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/check_permalink_download.py --limit 3
